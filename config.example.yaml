# NetSentinel yapılandırma şablonu
# Kopyalayın: cp config.example.yaml config.yaml && chmod 600 config.yaml
#
# ⚠️ Wi-Fi ŞİFRESİ YAZMAYIN! Yalnızca daha önce nmcli ile bağlanıp profil
#    oluşturduğunuz SSID adlarını yazın (bkz. security.md).

wifi:
  preferred:            # sırayla denenir; şifre YAZILMAZ, NetworkManager profili kullanılır
    - "EvAg_5G"
    - "EvAg_2.4G"
  connect_timeout: 30   # saniye

scan:
  mode: active          # active | passive
  ports: [80, 443, 554, 8080, 8554, 8000, 37777]
  rate_limit: 50        # saniyedeki paket (router'ı yormamak için yüksek değerlerden kaçının)
  host_timeout: 5       # tek cihaz için maksimum analiz süresi (saniye)

whitelist:              # kendi cihazlarınız: MAC büyük-küçük harf/farklı ayraç tolere edilir
  - mac: "AA:BB:CC:11:22:33"
    label: "Router"
  - mac: "DD:EE:FF:44:55:66"
    label: "Telefonum"

output:
  directory: "./reports"
  anonymize: false      # true ise raporlarda IP/MAC son oktetleri maskelenir
