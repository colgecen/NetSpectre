name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    name: Test & lint (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (denetim)
        run: ruff check .
      - name: Ruff (biçim kontrolü)
        run: ruff format --check .
      - name: Mypy (tip denetimi)
        run: mypy
      - name: Pytest
        run: pytest -q

  security-audit:
    name: Bağımlılık güvenliği (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit kur
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Uygulama bağımlılıklarında CVE taraması
        run: pip-audit --strict -r requirements.txt --progress-spinner off
